[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pashto-local-asr"
version = "0.1.0"
description = "Offline Pashto/Dari speech transcription with provenance and a quality screen"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Hares Noori" }]
dependencies = ["numpy", "av", "torch", "transformers"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pashto-asr = "pashto_local_asr.cli:main"

[tool.setuptools]
packages = ["pashto_local_asr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
